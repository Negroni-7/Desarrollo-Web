<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>

        let tareas = [];
        function agregarTarea() {

            let input = document.getElementById("txtTarea");
            let texto = input.value;

            if (texto === "") {
                alert("Escribe algo primero");
                return;
            }

            let tarea = {
                "id": Date.now(),
                "texto": texto,
                "completada": false
            };

            tareas.push(tarea);
            input.value = "";
            mostrarTareas();
        }

        function eliminarTarea(id) {
            tareas = tareas.filter(tarea => tarea.id !== id);
            mostrarTareas();
        }

        function mostrarTareas() {
            let lista = document.getElementById("listaTareas");
            let contador = document.getElementById("contador");
            lista.innerHTML = "";
            tareas.forEach((tarea) => {

                let li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center";
                li.innerText = tarea.texto;

                let boton = document.createElement("button");
                boton.innerText = "X";
                boton.className = "btn btn-danger btn-sm";
                boton.setAttribute("type", "button");

                boton.onclick = function () {
                    eliminarTarea(tarea.id);
                };

                li.appendChild(boton);
                lista.appendChild(li);
            });

            console.log("Total tareas: " + tareas.length);

            if (tareas.length === 0) {
                contador.innerText = "No hay tareas";
            } else {
                contador.innerText = tareas.length + " tarea(s)";
            }
        }

    </script>

</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Mis Tareas</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="input-group mb-3">
                    <input type="text" id="txtTarea" class="form-control" placeholder="Escribe una tarea...">
                    <button class="btn btn-primary" onclick="agregarTarea()">Agregar</button>
                </div>

                <ul id="listaTareas" class="list-group"></ul>
                <p class="text-muted mt-3 text-center" id="contador">No hay tareas</p>

            </div>
        </div>
    </div>

</body>
</html>
