<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos - JS + Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <div class="container py-5" style="max-width: 500px;">
        <div class="card shadow-sm">
            <div class="card-body">

                <h1 class="h4 card-title mb-3">Agregar Producto</h1>

                <div class="mb-3">
                    <label for="txtId" class="form-label">ID</label>
                    <input id="txtId" type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="txtNombre" class="form-label">Nombre</label>
                    <input id="txtNombre" type="text" class="form-control">
                </div>

                <button type="button" class="btn btn-primary" onclick="agregarProducto();">
                    Agregar
                </button>

                <hr class="my-4">

                <h2 class="h6">Productos</h2>

                <ul id="listaProductos" class="list-group"></ul>
            </div>
        </div>
    </div>

    <script>
        const responseAPI = {
                "status": 200,
                "message": "Productos Obtenidos",
                "data": [
                {"id":"1","nombre":"Alicate"},
                {"id":"2","nombre":"Serrucho"},
                {"id":"3","nombre":"Clavos"},
                {"id":"4","nombre":"Alambre"}
            ]
        };

        function crearItemProducto(id,nombre){
            const li = document.createElement("li");
            li.setAttribute("class", "list-group-item d-flex justify-content-between align-items-center");

            const spanNombre = document.createElement("span");
            spanNombre.innerText = nombre;

            const badgeId = document.createElement("span");
            badgeId.setAttribute("class", "badge bg-secondary rounded-pill");
            badgeId.innerText = id;
        
            li.appendChild(spanNombre);
            li.appendChild(badgeId);

            return li;
        }

        function cargarProductos(){
            const lista = document.getElementById("listaProductos");
            responseAPI.data.forEach((prod) => {
                lista.appendChild(crearItemProducto(prod.id, prod.nombre));
            })
        }

        function idYaExiste(id) {
            const lista = document.getElementById("listaProductos");
            const badges = lista.querySelectorAll(".badge");
            for (let i = 0; i < badges.length; i++) {
                if (badges[i].innerText === id) {
                    return true;
                }
            }
            return false;
        }

        function agregarProducto() {
            const lista = document.getElementById("listaProductos");
            const id = document.getElementById("txtId").value;
            const nombre = document.getElementById("txtNombre").value;

            if (!id || !nombre) {
                alert("Completa ID y Nombre.");
                return;
            }

            if (idYaExiste(id)) {
                alert("Ya existe un producto con ese ID.");
                return;
            }

            lista.appendChild(crearItemProducto(id, nombre));

            document.getElementById("txtId").value = "";
            document.getElementById("txtNombre").value = "";
        }

        window.onload = cargarProductos;
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
